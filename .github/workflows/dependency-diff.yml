name: Dependency Diff

on:
  pull_request:

jobs:
  diff_dependencies:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create Diff
        uses: e18e/action-dependency-diff@9a7f09f5f2993256322e0db17ee4c8d9339dab77  # v1
