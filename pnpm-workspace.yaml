# Build-script approvals. pnpm 11 reads allowBuilds; pnpm 10 (pinned in CI) reads
# onlyBuiltDependencies. Keep both until CI moves to pnpm 11.
allowBuilds:
  '@parcel/watcher': true
onlyBuiltDependencies:
  - '@parcel/watcher'
overrides:
  got@<11.8.5: '>=11.8.5'
  http-cache-semantics@<4.1.1: '>=4.1.1'
  semver-regex@<3.1.3: '>=3.1.3'
  semver-regex@<3.1.4: '>=3.1.4'
  micromatch@<4.0.8: '>=4.0.8'
  cookie@<0.7.0: '>=0.7.0'
  cross-spawn@<6.0.6: '>=6.0.6'
  cross-spawn@>=7.0.0 <7.0.5: '>=7.0.5'
